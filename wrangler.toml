#:schema node_modules/wrangler/config-schema.json
name = "mailflare"

# 由 [build] 生成，不要手改。
main = "build/worker/shim.mjs"

compatibility_date = "2025-01-01"
# 强制全局 fetch 只走公网：默认允许请求「同账号内的私有来源」，
# 而推送目标是第三方服务（Bark / Telegram），走公网才是预期行为。
# 配错了也不会静默访问到内部资源。
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# 关闭 Preview URLs：预览域名会把未发布的版本暴露到公网，
# 而这个 Worker 存的是私人邮件。
preview_urls = false

# 云端构建入口。控制台填：
#   Build command:   bun run build
#   Deploy command:  bun run deploy
#   Build variable:  BUN_VERSION=1.4.4
[build]
command = "bash scripts/build.sh"

# D1：不写 database_id，wrangler 按名字自动绑定。
[[d1_databases]]
binding = "DB"
database_name = "mailflare"
migrations_dir = "migrations"

# R2 走 S3 API，不用 Worker 绑定。四项配置在网页「设置」里填。

[assets]
directory = "./public"
binding = "ASSETS"
# 只让 /api/* 进 Worker：静态资源（HTML/JS/CSS/图标）由边缘直接返回，
# 不消耗 Worker 请求配额，也没有冷启动等待。
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# 环境变量只有三个登录凭证，其余配置都在 D1：
#   ADMIN_USERNAME / ADMIN_PASSWORD / JWT_SECRET
# Email Routing -> Send to Worker 触发 email 事件。
