#:schema node_modules/wrangler/config-schema.json
name = "mailflare"

# Workers 构建产物入口。由 `[build].command` 生成，不要手改。
main = "build/worker/shim.mjs"

compatibility_date = "2025-01-01"
workers_dev = true

# ---------------------------------------------------------------------------
# 构建
#
# Cloudflare 连 GitHub 后会**在云端**执行这条命令，所以它必须自包含：
# 不能假设环境里已装好 Rust 或 bun。
#
# 控制台构建配置：
#   Build command:   bun run build
#   Deploy command:  bunx wrangler deploy
#   Build variable:  BUN_VERSION=1.4.4
#
# scripts/build.sh 负责全部前置工作（装 Rust、加 wasm32 target、
# 绕开 pkg-config 探测 OpenSSL、装 worker-build、构建前端、编译 wasm），
# 且是幂等的：已构建且源文件未变时直接跳过。
# ---------------------------------------------------------------------------
[build]
command = "bash scripts/build.sh"

# ---------------------------------------------------------------------------
# D1：邮件元数据 + 后台设置
#
# 只写 `binding` 与 `database_name`，**不写 `database_id`**：
# wrangler 会按名字在账号里找同名数据库并自动绑定。这样不用把 ID 抄进
# 仓库，也就没有「占位符忘了替换导致部署失败」这个坑。
#
# 前提：先在控制台 Workers & Pages -> D1 创建名为 `mailflare` 的库，
# 并在它的 Console 里执行 schema.sql 建表。
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "mailflare"
# 迁移目录：`wrangler d1 migrations apply` 会按文件名顺序执行这里未跑过的 SQL，
# 已执行的记录在 D1 自己的 d1_migrations 表里，重复部署不会重跑。
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# R2：**不走 Worker 绑定**
#
# 附件通过 R2 的 S3 API（`{account_id}.r2.cloudflarestorage.com` + SigV4）
# 读写。账号 ID、Access Key、Secret Key、桶名全部存在 D1，在网页「设置」
# 里填，改完即时生效，不需要重新部署，也不需要在这里声明 [[r2_buckets]]。
#
# 这样做的好处：桶是用户自己的资源，用哪个桶、叫什么名字由用户决定，
# 代码不限制、也不校验桶名。附件统一放在桶内的 `mail/att/{id}/{n}`。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 静态资源：单页前端
#
# `run_worker_first = true` 让所有请求先经过 Worker：
#   /api/*   -> Rust 处理
#   其它路径 -> src/lib.rs 转发给 ASSETS（边缘返回，不进 Rust 逻辑）
#
# 不写成数组形式 `["/api/*"]`：旧版 wrangler 会忽略它，届时 SPA 的
# not_found_handling 会把不存在的 `/api/...` 也回成 index.html，
# 前端拿到的就不是 JSON 了。布尔形式兼容性最好。
# ---------------------------------------------------------------------------
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# 环境变量
#
# 这里**只有三个**，都是登录的根凭证，必须在控制台
# Settings -> Variables and Secrets 里添加，类型选 Secret：
#
#   ADMIN_USERNAME    管理员用户名
#   ADMIN_PASSWORD    管理员密码
#   JWT_SECRET        HMAC 密钥，openssl rand -base64 48
#
# 其余全部配置（Turnstile、站点地址、推送渠道、收信限额、分页、会话时长）
# 都存在 D1 的 configs 表里，部署后在网页「设置」里改，即时生效，
# 不需要重新部署，也不用重走构建。
#
# 不把可选参数放进 [vars]：Worker 环境变量运行时改不了，
# 每加一个参数都要用户重填一遍面板，很快就会失控。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 收信
#
# Cloudflare Email Routing 指向本 Worker 后会自动触发 email 事件。
# 绑定在控制台配置：Email Routing -> 路由规则 -> Send to Worker。
# ---------------------------------------------------------------------------
