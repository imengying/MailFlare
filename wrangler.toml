#:schema node_modules/wrangler/config-schema.json
name = "mailflare"

# Workers 构建产物入口。由 `[build].command` 生成，不要手改。
main = "build/worker/shim.mjs"

compatibility_date = "2025-01-01"
workers_dev = true

# ---------------------------------------------------------------------------
# 构建
#
# Cloudflare 的 GitHub 集成会在**云端**执行这条命令，所以它必须是
# 自包含的：不能假设环境里已装好 Rust 工具链或 bun。
#
# 前置条件（在 Cloudflare 控制台的构建配置里设置）：
#   - 构建变量 Build command:  见下方 command
#   - 根目录 Deploy command:   npx wrangler deploy
#
# 说明：Cloudflare 的构建镜像已内置 Rust 与 wasm32 target，
# 但默认没有 worker-build。下面用 cargo install 现装（约 1-2 分钟，
# 会缓存到构建缓存里）。前端用 bun（镜像同样内置）。
# ---------------------------------------------------------------------------
[build]
command = """
rustup target add wasm32-unknown-unknown &&
cargo install worker-build --version 0.8.7 --locked &&
bun install &&
bun run build &&
worker-build --release
"""

# ---------------------------------------------------------------------------
# D1：邮件元数据 + 动态配置
#
# 这个 database_id 必须换成你自己的：
#   wrangler d1 create mailflare
# 或者在控制台 Workers & Pages -> D1 创建后复制 ID。
# 保持全 0 会导致部署失败（Cloudflare 会报找不到数据库）。
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "mailflare"
database_id = "00000000-0000-0000-0000-000000000000"

# ---------------------------------------------------------------------------
# R2：原始 .eml 与附件
#   wrangler r2 bucket create mailflare-mail
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "R2"
bucket_name = "mailflare-mail"

# ---------------------------------------------------------------------------
# 静态资源：单页前端
#
# `run_worker_first = true` 让所有请求先经过 Worker：
#   /api/*   -> Rust 处理
#   其它路径 -> src/lib.rs 转发给 ASSETS（边缘返回，不进 Rust 逻辑）
#
# 不写成数组形式 `["/api/*"]`：旧版 wrangler 会忽略它，届时 SPA 的
# not_found_handling 会把不存在的 `/api/...` 也回成 index.html，
# 前端拿到的就不是 JSON 了。布尔形式兼容性最好。
# ---------------------------------------------------------------------------
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# 环境变量（非敏感项）
#
# ⚠️ 敏感项不要写在这里，也不要提交到 GitHub。
# 通过控制台 Settings -> Variables and Secrets 添加为 **Secret**：
#   ADMIN_PASSWORD    管理员密码（必填）
#   JWT_SECRET        HMAC 密钥，建议 openssl rand -base64 48（必填）
#   TURNSTILE_SECRET  Turnstile secret（留空则跳过人机验证，仅限本地开发）
#
# 注意：在控制台设置的同名变量会覆盖这里的值。
# ---------------------------------------------------------------------------
[vars]
# Turnstile 的 site key 是公开值，会下发给前端渲染挂件；留空则前端隐藏验证框。
TURNSTILE_SITE_KEY = ""
# 可选：限制 Turnstile token 只能在指定 hostname 上使用。
TURNSTILE_HOSTNAME = ""

# 可选：前端与后端不同源部署时填写前端来源，例如 "https://mail.example.com"。
# 同源部署留空即可。
ALLOWED_ORIGIN = ""

# 可选：站点对外地址，用于在 Telegram/Bark 消息里拼「查看详情」链接。
# 留空时退回 ALLOWED_ORIGIN；都为空则消息里不带链接。
PUBLIC_URL = ""

# JWT 有效期（秒），默认 7 天。
JWT_TTL_SECS = "604800"

# 原始 .eml 是否保存到 R2（"0" 关闭）。
STORE_RAW_EML = "1"

# 单封邮件正文入库上限（字节），超出部分截断。默认 256KB。
MAX_BODY_BYTES = "262144"
# 单封邮件整体大小上限（字节），超过直接 SMTP 拒收。默认 20MB。
MAX_MESSAGE_BYTES = "20971520"
# 单个附件转存 R2 的上限（字节）。默认 10MB。
MAX_ATTACHMENT_BYTES = "10485760"
# 附件并发上传度。
R2_CONCURRENCY = "4"
# 列表默认/最大分页大小。
PAGE_SIZE_DEFAULT = "20"
PAGE_SIZE_MAX = "100"

# ---------------------------------------------------------------------------
# 收信
#
# Cloudflare Email Routing 指向本 Worker 后会自动触发 email 事件。
# 绑定在控制台配置：Email Routing -> 路由规则 -> Send to Worker。
# 语法上也可以用下面这段声明（需先在控制台启用 Email Routing）：
# ---------------------------------------------------------------------------
# [[send_email]]
# name = "MAILER"
